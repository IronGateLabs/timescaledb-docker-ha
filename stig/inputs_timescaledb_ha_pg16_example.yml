---
windows_runner: false

pg_owner: "postgres"
pg_group: "postgres"
pg_dba: "postgres"
pg_dba_password: "<set-at-runtime>"
pg_host: "127.0.0.1"
pg_port: 5432
pg_db: "postgres"

pg_version: "16.x"
min_org_allowed_postgres_version: "16.x"

pg_data_dir: "/home/postgres/pgdata/data"
pg_log_dir: "/home/postgres/pg_log"
pg_audit_log_dir: "/home/postgres/pg_log"
pg_conf_file: "/home/postgres/pgdata/data/postgresql.conf"
pg_user_defined_conf: "/home/postgres/pgdata/data/stig-postgresql.conf"
pg_hba_conf_file: "/home/postgres/pgdata/data/pg_hba.conf"
pg_ident_conf_file: "/home/postgres/pgdata/data/pg_ident.conf"

pg_shared_dirs:
  - "/usr/lib/postgresql/16"
  - "/usr/lib/postgresql/16/bin"
  - "/usr/lib/postgresql/16/lib"
  - "/usr/share/postgresql/16"

pgaudit_installation: "/usr/lib/postgresql/16/lib"

pg_superusers:
  - "postgres"

pg_users:
  - "pg_execute_server_program"
  - "pg_monitor"
  - "pg_read_all_settings"
  - "pg_read_all_stats"
  - "pg_read_server_files"
  - "pg_signal_backend"
  - "pg_stat_scan_tables"
  - "pg_write_server_files"
  - "postgres"

pg_replicas: []

approved_auth_methods:
  - "cert clientcert=verify-full"
  - "gss"
  - "ldap"
  - "scram-sha-256"
  - "sspi"

approved_packages:
  - "postgresql-16"
  - "postgresql-client-16"
  - "postgresql-16-pgaudit"
  - "postgresql-16-postgis-3"
  - "timescaledb-2-postgresql-16"

approved_ext:
  - "plpgsql"
  - "pgaudit"
  - "timescaledb"

pg_max_connections: 100
pg_timezone: "UTC"
pg_object_granted_privileges: "arwdDxt"
pg_object_public_privileges: "rw"
pg_object_exceptions:
  - "pg_settings"
